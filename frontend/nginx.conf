server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 16m;

  location / {
    try_files $uri /index.html;
  }

  # Same-origin proxy to the API container, so the SPA needs no CORS config
  # and VITE_API_BASE can stay empty.
  location ~ ^/(predict|healthz|classes|heatmap)(/|$) {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
  }
}
